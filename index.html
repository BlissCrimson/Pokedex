<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="shortcut icon" href="./assets/icons/pokedex-favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./styles/colors.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/loadingSpinner.css">
    <link rel="stylesheet" href="./styles/miniPokemon.css">
    <link rel="stylesheet" href="./styles/pokemonDetails.css">
    <link rel="stylesheet" href="./styles/responsive.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/style.css">

    <script src="./scripts/allVariables.js"></script>
    <script src="./scripts/loadingSpinner.js"></script>
    <script src="./scripts/templates.js"></script>
    <script src="./scripts/fetchApi.js"></script>
    <script src="./scripts/searchPokemon.js"></script>
</head>

<body onload="init()">
    <header class="header-index">
        <div class="header-content">
            <div class="header-logo">
                <b>P</b><img class="header-img" src="./assets/icons/pokeball.svg" alt="Pokeball"> <b>KEDEX</b>
            </div>
            <div>
                <label for="search">Search:</label>
                <input id="search" type="search" minlength="3" incremental>
                <div id="searchResults" class="search-results"></div>
                <button type="button" onclick="searchPokemonNames()">Suchen</button>
            </div>
        </div>
    </header>

    <main>
        <section name="loading spinner">
            <div id="loadingSpinner" class="spinner d_none">
                <img class="spinner-img" src="./assets/icons/pokeball-duo_icon.svg" alt="Pokeball Duo">
            </div>
        </section>
        <section id="allPokemon" class="pokemon-mini-box"></section>
        <section class="more-Pokemon">
            <button class="btn-plus-pokemon" onclick="nextPokemon()">Load More</button>
        </section>
        <dialog id="pokemonDialog"> </dialog>
    </main>

    <footer class="footer-index">
        <span>&copy; 2025 Pokedex</span>
        <span>developed by</span>
        <span>Matthias Tausch</span>
    </footer>
    <script src="./scripts/script.js"></script>
</body>

</html>
